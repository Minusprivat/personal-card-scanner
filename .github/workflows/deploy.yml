name: App veröffentlichen

# Baut die App samt Tagesdaten, legt die Web-App auf GitHub Pages ab
# und stellt die Android-App (APK) als Download bereit.
on:
  push:
    branches: [main]
  # Täglich nach Erscheinen der Cardmarket-Preisdatei (gegen 02:45 Uhr deutscher Zeit).
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Die Versionsnummer ist die Zahl der Commits; dafür braucht es den ganzen Verlauf.
          fetch-depth: 0
      - name: Versionsnummer bestimmen
        run: echo "APP_VERSION=0.1.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Tests laufen vor dem Datenabruf: Die Abnahme-Schwellen aus M0 sollen die tägliche
      # Aktualisierung nicht anhalten. Unlesbare Daten bricht das Datenskript selbst ab.
      - run: npm test
      - name: Katalog und Preise laden
        run: npm run data:build
      # Fingerabdrücke neuer Kartenbilder merkt sich GitHub zwischen den Läufen,
      # damit jedes Bild nur ein einziges Mal abgerufen wird.
      - uses: actions/cache@v6
        with:
          path: .cache/fingerprints.json
          key: fingerprints-v1-${{ github.run_id }}
          restore-keys: fingerprints-v1-
      - name: Fingerabdrücke für neue Kartenbilder
        run: npm run data:fingerprints
      # "apk" nennt die älteste APK, mit der diese Version läuft: den letzten Stand, an dem sich
      # die Android-Hülle geändert hat. Ältere APKs bekommen den Hinweis, eine neue zu laden;
      # alle anderen laden nur den Web-Teil nach (src/app/updater.ts).
      - name: Versionsdatei für das Selbst-Update der Android-App
        run: |
          huelle=$(git rev-list --count "$(git log -1 --format=%H -- android capacitor.config.ts package.json)")
          # APKs vor 0.1.15 können sich nicht selbst aktualisieren: Ihre Update-Prüfung bleibt beim
          # Laden des Update-Bausteins hängen, und bis 0.1.13 fehlte zudem die Prüfsumme des Pakets.
          # Sie brauchen einmal eine neue APK von Hand.
          if [ "$huelle" -lt 15 ]; then huelle=15; fi
          echo "APK_MIN=$huelle" >> "$GITHUB_ENV"
          echo "{\"version\":\"$APP_VERSION\",\"apk\":$huelle}" > public/data/version.json
          cat public/data/version.json
      # Die Android-App nutzt dieselben Daten, damit die Quellen nur einmal abgerufen werden.
      - uses: actions/upload-artifact@v7
        with:
          name: tagesdaten
          path: public/data
          retention-days: 1
      # Derselbe Web-Teil wie in der APK (ohne Unterpfad), als Paket zum Nachladen.
      - name: Update-Paket für die Android-App bauen
        run: |
          npm run build
          (cd dist && zip -q -r "../app-$APP_VERSION.zip" .)
          ls -l "app-$APP_VERSION.zip"
      - name: Web-App bauen
        run: npm run build
        env:
          BASE_PATH: /personal-card-scanner/
      # Die veröffentlichte Versionsdatei nennt zusätzlich die Prüfsumme des Pakets (SHA-256).
      # Der Update-Baustein lädt kein Paket ohne sie und vergleicht sie nach dem Laden.
      - name: Update-Paket zur Web-App legen
        run: |
          mkdir -p dist/bundle
          mv "app-$APP_VERSION.zip" dist/bundle/
          pruefsumme=$(sha256sum "dist/bundle/app-$APP_VERSION.zip" | cut -d' ' -f1)
          echo "{\"version\":\"$APP_VERSION\",\"apk\":$APK_MIN,\"sha256\":\"$pruefsumme\"}" > dist/data/version.json
          cat dist/data/version.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  apk:
    needs: build
    # Der tägliche Lauf ändert nur Daten; die holt sich die App selbst. Eine neue APK
    # entsteht nur, wenn sich der Code geändert hat.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Versionsnummer bestimmen
        run: |
          build=$(git rev-list --count HEAD)
          echo "APP_BUILD=$build" >> "$GITHUB_ENV"
          echo "APP_VERSION=0.1.$build" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: tagesdaten
          path: public/data
      - name: Web-Teil bauen
        run: npm run build
      - name: In das Android-Projekt übernehmen
        run: npx cap sync android
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PappVersionCode="$APP_BUILD" \
            -PappVersionName="$APP_VERSION"
      - name: Prüfen, dass die APK alle Dateien der Web-App unverändert enthält
        # Der Android-Bau packt zum Beispiel .gz-Dateien aus und benennt sie um; die App
        # fände sie dann nicht mehr. Jede Datei aus dist/ muss unter gleichem Namen in der APK liegen.
        run: |
          export LC_ALL=C
          unzip -Z1 android/app/build/outputs/apk/debug/app-debug.apk | sort > apk-inhalt.txt
          (cd dist && find . -type f | sed 's|^\./|assets/public/|' | sort) > erwartet.txt
          fehlend=$(comm -23 erwartet.txt apk-inhalt.txt)
          if [ -n "$fehlend" ]; then
            echo "Diese Dateien fehlen in der APK oder heißen dort anders:"
            echo "$fehlend"
            exit 1
          fi
          echo "$(wc -l < erwartet.txt) Dateien geprüft."
      - name: APK als Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk card-scanner.apk
          notes="Version $APP_VERSION vom $(date -u +%d.%m.%Y). Die Datei card-scanner.apk auf dem Handy öffnen, um die App zu installieren oder zu aktualisieren."
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk card-scanner.apk --clobber
            gh release edit apk --notes "$notes"
          else
            gh release create apk card-scanner.apk --title "Card Scanner für Android" --notes "$notes"
          fi
